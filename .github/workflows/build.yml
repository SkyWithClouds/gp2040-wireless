name: Bridge CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      stage:
        description: Hardware integration stage
        type: choice
        required: true
        options: [xinput, esb, full]
permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify wire vectors and malformed records
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icommon tests/protocol_test.c -o /tmp/test-protocol
          /tmp/test-protocol
          cc -std=c11 -Wall -Wextra -Werror -Icommon tests/survey_test.c -o /tmp/survey && /tmp/survey
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Iusb-rx/src tests/xinput_test.c usb-rx/src/reports.c -o /tmp/test-xinput
          /tmp/test-xinput
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icommon -Iusb-rx/src -Iradio-tx/src \
            tests/esb_test.c usb-rx/src/receiver.c radio-tx/src/transmitter.c -o /tmp/test-esb
          /tmp/test-esb
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Icommon -Ipico-host/src -Iusb-rx/src -Iradio-tx/src \
            tests/full_test.c pico-host/src/source.c usb-rx/src/receiver.c radio-tx/src/transmitter.c -o /tmp/test-full
          /tmp/test-full
          cc -std=c11 -Wall -Wextra -Werror -Icommon -Iusb-rx/src tests/multislot_test.c usb-rx/src/receiver.c -o /tmp/multislot
          /tmp/multislot

  nordic:
    container:
      image: ghcr.io/nrfconnect/sdk-nrf-toolchain@sha256:d5dac06a877ca7f7bc75f851a7720284796424304045dd681cc6c4a29340ef0c
    needs: protocol
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.stage == 'xinput' && '[{"stage":"xinput","app":"usb-rx"}]' || inputs.stage == 'esb' && '[{"stage":"esb","app":"usb-rx"},{"stage":"esb","app":"radio-tx"}]' || inputs.stage == 'full' && '[{"stage":"full","app":"usb-rx"},{"stage":"full","app":"radio-tx"}]' || '[{"stage":"xinput","app":"usb-rx"},{"stage":"esb","app":"usb-rx"},{"stage":"esb","app":"radio-tx"},{"stage":"full","app":"usb-rx"},{"stage":"full","app":"radio-tx"}]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge
      - name: Check stage sources and board definition
        env:
          APP: ${{ matrix.app }}
        run: |
          test -f "bridge/$APP/CMakeLists.txt" || { echo "::error::Firmware stage source is pending"; exit 1; }
          test -f bridge/boards/nologo/nologo_promicro/board.yml || { echo "::error::NOLOGO board definition is pending"; exit 1; }
      - name: Fetch pinned NCS v2.9.2
        run: |
          west init -l bridge
          west update --narrow -o=--depth=1
      - name: Build NOLOGO UF2
        env:
          APP: ${{ matrix.app }}
          STAGE: ${{ matrix.stage }}
        run: |
          export ZEPHYR_BASE="$PWD/zephyr"
          west build --no-sysbuild -b nologo_promicro/nrf52840 -d build "bridge/$APP" -- \
            -DBOARD_ROOT="$PWD/bridge" -DBRIDGE_STAGE="$STAGE"
          python3 bridge/scripts/check_receiver_uf2.py build/zephyr/zephyr.uf2 build/zephyr/zephyr.bin
          mkdir -p package
          filename=usb-rx-xinput-nologo-26000.uf2
          if [[ "$STAGE" == esb ]]; then
            case "$APP" in
              radio-tx) filename=01-transmitter-esb-nologo-26000.uf2 ;;
              usb-rx) filename=02-receiver-esb-nologo-26000.uf2 ;;
            esac
          elif [[ "$STAGE" == full ]]; then
            case "$APP" in
              radio-tx) filename=02-transmitter-full.uf2 ;;
              usb-rx) filename=03-receiver-full.uf2 ;;
            esac
          fi
          cp build/zephyr/zephyr.uf2 "package/$filename"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.stage }}-${{ github.sha }}
          path: package/*.uf2
          if-no-files-found: error

  pico:
    name: pico-host
    if: inputs.stage == '' || inputs.stage == 'full'
    needs: protocol
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: bridge
      - name: Check stage source
        run: test -f bridge/pico-host/CMakeLists.txt || { echo "::error::Pico host stage source is pending"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: a1438dff1d38bd9c65dbd693f0e5db4b9ae91779
          path: deps/pico-sdk
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: sekigon-gonnoc/Pico-PIO-USB
          ref: b186e36bea0f3bcc2ee94ca1fa81e7f71281443a
          path: deps/pio-usb
      - uses: actions/checkout@v4
        with:
          repository: Ryzee119/tusb_xinput
          ref: d202fcfbd6d0a1f38c7b203696ac13776b39e601
          path: deps/tusb_xinput
      - name: Install verified Arm embedded toolchain
        run: |
          set -euo pipefail
          archive=xpack-arm-none-eabi-gcc-13.3.1-1.1-linux-x64.tar.gz
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 240 \
            "https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v13.3.1-1.1/$archive" -o "$RUNNER_TEMP/$archive"
          cd "$RUNNER_TEMP"
          echo "006c89337eced277fdf4c1c3bf3aebe55c85e8d52cba8d412009717fb781b959  $archive" | sha256sum -c -
          mkdir arm-toolchain
          tar -xzf "$archive" -C arm-toolchain --strip-components=1
          "$RUNNER_TEMP/arm-toolchain/bin/arm-none-eabi-gcc" --version
          echo "$RUNNER_TEMP/arm-toolchain/bin" >> "$GITHUB_PATH"
      - name: Configure RP2040 application
        run: |
          cmake -S bridge/pico-host -B build -G Ninja -DPICO_BOARD=pico \
            -DPICO_SDK_PATH="$PWD/deps/pico-sdk" -DPICO_PIO_USB_PATH="$PWD/deps/pio-usb" \
            -DTUSB_XINPUT_PATH="$PWD/deps/tusb_xinput" -DPICOTOOL_GIT_BRANCH=a7eb3988f0645239185fadb4e25d8279478c2dbb
      - name: Build and validate Pico firmware
        run: |
          cmake --build build
          python3 bridge/scripts/check_receiver_uf2.py build/pico-host.uf2 build/pico-host.bin --pico
          cp build/pico-host.uf2 build/01-pico-host-full.uf2
      - uses: actions/upload-artifact@v4
        with:
          name: pico-host-full-${{ github.sha }}
          path: build/01-pico-host-full.uf2
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [nordic, pico]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish checked firmware and SHA-256 manifest
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.uf2)
          test "${#files[@]}" -eq 6
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          opts=()
          if [[ "$TAG" == *-* ]]; then opts+=(--prerelease); fi
          gh release create "$TAG" "${files[@]}" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$TAG" --generate-notes "${opts[@]}"
